<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KvizMajstor — Admin</title>
</head>
<body style="background:#0F1123;color:#94A3B8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <p>Učitavanje admin panela…</p>
  <script>
  (async () => {
    try {
      const r = await fetch('/pages/admin-full.html?v=3');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const html = await r.text();
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.body.innerHTML = '<p style="color:#F87171">Greška pri učitavanju: ' + e.message + '</p>';
    }
  })();
  </script>
</body>
</html>
