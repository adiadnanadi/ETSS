<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KvizMajstor — Admin</title>
</head>
<body style="background:#0F1123;color:#94A3B8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <p>Učitavanje admin panela…</p>
  <script>
  (async () => {
    try {
      const urls = ['/pages/admin-p1.html?v=2', '/pages/admin-p2.html?v=2', '/pages/admin-p3.html?v=2', '/pages/admin-p4.html?v=2'];
      const parts = await Promise.all(urls.map(u => fetch(u).then(r => {
        if (!r.ok) throw new Error(u + ' ' + r.status);
        return r.text();
      })));
      document.open();
      document.write(parts.join(''));
      document.close();
    } catch (e) {
      document.body.innerHTML = '<p style="color:#F87171">Greška: ' + e.message + '</p>';
    }
  })();
  </script>
</body>
</html>
