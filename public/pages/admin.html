<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KvizMajstor — Admin</title>
</head>
<body style="background:#0F1123;color:#94A3B8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <p>Učitavanje admin panela…</p>
  <script>
  (async () => {
    try {
      const urls = ['/pages/admin-s1.html?v=5','/pages/admin-s2.html?v=5','/pages/admin-s3.html?v=5','/pages/admin-s4.html?v=5','/pages/admin-s5.html?v=5','/pages/admin-s6.html?v=5'];
      const parts = await Promise.all(urls.map(u => fetch(u).then(r => {
        if (!r.ok) throw new Error(u + ' → ' + r.status);
        return r.text();
      })));
      document.open();
      document.write(parts.join(''));
      document.close();
    } catch (e) {
      document.body.innerHTML = '<div style="max-width:400px;text-align:center"><p style="color:#F87171;margin-bottom:12px">Greška: ' + e.message + '</p><p style="font-size:13px">Sačekaj deploy ili osvježi (Ctrl+Shift+R).</p></div>';
    }
  })();
  </script>
</body>
</html>
