<!DOCTYPE html>
<html lang="bs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>KvizMajstor — Kreiraj kviz</title></head>
<body style="background:#0B1120;color:#94A3B8;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif">
<p>Učitavanje…</p>
<script>
(async()=>{
  try{
    const [a,b]=await Promise.all([
      fetch('/pages/cq-p1.html?v=2').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}),
      fetch('/pages/cq-p2.html?v=2').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
    ]);
    document.open();document.write(a+b);document.close();
  }catch(e){document.body.innerHTML='<p style="color:#F87171">Greška: '+e.message+'</p>';}
})();
</script>
</body></html>
